[project]
name = "dedupe"
version = "2.0.0"
description = "Utility for comparing files based on various hashing algorithms"
authors = [{ name = "Jesse Almanrode", email = "jesse@almanrode.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
dependencies = [
    "blake3>=1.0.11",
    "click>=8.5.0",
]

[project.scripts]
dedupe = "dedupe:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "B", "SIM", "I"]
ignore = ["E501", "F401"]
